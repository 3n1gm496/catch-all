name: Build Android APK
on:
  push:
    branches: [chatgpt-android-build-20260922]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore project
        run: |
          mkdir -p android-build/project
          base64 -d android-build/project.tgz.b64 | tar -xzf - -C android-build/project

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20 || true
          ls "$ANDROID_HOME/build-tools" | tail -20 || true

      - name: Install Android SDK 35 if needed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true

      - name: Build debug APK
        working-directory: android-build/project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android-build/project/app/build/outputs/apk/debug/app-debug.apk android-build/AreaRiservataPdf.apk
          sha256sum android-build/AreaRiservataPdf.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AreaRiservataPdf-APK
          path: android-build/AreaRiservataPdf.apk
          if-no-files-found: error
